<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>혈압 수첩</title>
  
  <!-- 아이폰 홈 화면 전용 앱 아이콘 지정 -->
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2966/2966327.png">
  <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22혈압수첩%22,%22short_name%22:%22혈압수첩%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22#ffffff%22,%22theme_color%22:%22#2563eb%22}">
  
  <!-- Chart.js 및 SheetJS(XLSX) 라이브러리 -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  <!-- Firebase SDK 모듈 -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, addDoc, onSnapshot, deleteDoc, doc, query, orderBy } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Firebase 설정 데이터 (사용자 전달 설정값 적용)
    const firebaseConfig = {
      apiKey: "AIzaSyD6v6GiHBNE4ZOS47HCE-keJrnhjmk-ErE",
      authDomain: "my-bp-c948e.firebaseapp.com",
      projectId: "my-bp-c948e",
      storageBucket: "my-bp-c948e.firebasestorage.app",
      messagingSenderId: "774469305076",
      appId: "1:774469305076:web:d10b06954efb447a2214a1",
      measurementId: "G-46CBT0Q2NG"
    };

    // Firebase 초기화
    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const bpCollection = collection(db, "bpRecords");

    let records = [];

    // Chart.js 초기화
    const ctx = document.getElementById('bpChart').getContext('2d');
    let chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: '수축기', data: [], borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.2 },
          { label: '이완기', data: [], borderColor: '#3b82f6', backgroundColor: '#3b82f6', tension: 0.2 }
        ]
      },
      options: { 
        responsive: true, 
        scales: { 
          x: {
            ticks: {
              font: { size: 10 },
              maxRotation: 45,
              minRotation: 0
            }
          },
          y: { min: 50, max: 180 } 
        } 
      }
    });

    // 실시간 데이터 수신 (PC/아이폰 자동 동기화)
    const q = query(bpCollection, orderBy("rawTime", "asc"));
    onSnapshot(q, (snapshot) => {
      records = snapshot.docs.map(doc => ({
        id: doc.id,
        ...doc.data()
      }));
      updateUI();
    });

    function updateUI() {
      const recentRecords = records.slice(-10);

      chart.data.labels = recentRecords.map(r => r.displayTime || r.time);
      chart.data.datasets[0].data = recentRecords.map(r => r.sys);
      chart.data.datasets[1].data = recentRecords.map(r => r.dia);
      chart.update();

      const listEl = document.getElementById('recordList');
      listEl.innerHTML = records.slice().reverse().map((r) => {
        const memoHtml = r.memo && r.memo.trim() !== '' 
          ? `<div class="memo-tag">💬 ${r.memo}</div>` 
          : `<div class="no-memo"></div>`;
          
        return `
          <li>
            <div class="record-info">
              <div class="bp-val">${r.sys} / ${r.dia} <span class="unit">mmHg</span></div>
              <div class="date">🕒 ${r.displayTime || r.time}</div>
            </div>
            ${memoHtml}
            <button class="del-btn" onclick="deleteRecord('${r.id}')">삭제</button>
          </li>
        `;
      }).join('');
    }

    // 기록 삭제 함수
    window.deleteRecord = async function(id) {
      if (confirm('이 기록을 삭제하시겠습니까?')) {
        try {
          await deleteDoc(doc(db, "bpRecords", id));
        } catch (e) {
          alert("삭제 중 오류가 발생했습니다: " + e.message);
        }
      }
    };

    // XLSX 다운로드 함수
    window.exportToXlsx = function() {
      if (records.length === 0) {
        alert('저장된 혈압 기록이 없습니다.');
        return;
      }

      const excelData = records.map(r => ({
        "측정 일시": r.displayTime || r.time,
        "수축기 (mmHg)": r.sys,
        "이완기 (mmHg)": r.dia,
        "메모": r.memo || ''
      }));

      const worksheet = XLSX.utils.json_to_sheet(excelData);
      const workbook = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(workbook, worksheet, "혈압기록");

      worksheet['!cols'] = [
        { wch: 18 },
        { wch: 15 },
        { wch: 15 },
        { wch: 25 }
      ];

      const today = new Date().toISOString().slice(0, 10);
      XLSX.writeFile(workbook, `혈압기록_${today}.xlsx`);
    };

    // 폼 제출 이벤트 (새 혈압 기록 등록)
    document.getElementById('bpForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const sys = Number(document.getElementById('sys').value);
      const dia = Number(document.getElementById('dia').value);
      const memo = document.getElementById('memo').value;
      const now = new Date();
      
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      
      const displayTime = `${month}/${date} ${hours}:${minutes}`;

      try {
        await addDoc(bpCollection, {
          sys,
          dia,
          memo,
          time: displayTime,
          displayTime: displayTime,
          rawTime: now.toISOString()
        });

        document.getElementById('sys').value = '';
        document.getElementById('dia').value = '';
        document.getElementById('memo').value = '';
      } catch (e) {
        alert("저장 중 오류가 발생했습니다: " + e.message);
      }
    });
  </script>

  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f3f4f6; margin: 0; padding: 16px; color: #1f2937; }
    .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 16px; }
    h1 { font-size: 20px; margin-top: 0; color: #2563eb; text-align: center; }
    .header-group { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    h3 { font-size: 17px; margin: 0; }
    label { font-size: 14px; color: #4b5563; font-weight: 600; display: block; margin-top: 10px; }
    input { width: 100%; padding: 12px; margin-top: 4px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; }
    button.submit-btn { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 16px; cursor: pointer; }
    .excel-btn { background: #10b981; color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 13px; font-weight: bold; cursor: pointer; }
    .alarm-info { background: #eff6ff; padding: 12px; border-radius: 8px; font-size: 13px; color: #1e40af; margin-bottom: 16px; text-align: center; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #f3f4f6; gap: 8px; }
    
    .record-info { flex-shrink: 0; }
    .bp-val { font-size: 20px; font-weight: 800; color: #111827; }
    .unit { font-size: 14px; font-weight: normal; color: #6b7280; }
    .date { color: #4b5563; font-size: 13px; font-weight: 600; margin-top: 2px; }
    
    .memo-tag { flex: 1; font-size: 13px; color: #374151; background: #f3f4f6; padding: 6px 10px; border-radius: 6px; margin: 0 4px; word-break: break-all; }
    .no-memo { flex: 1; }
    
    .del-btn { background: #fee2e2; color: #ef4444; border: none; padding: 5px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold; flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🩸 나의 혈압 수첩</h1>
    <div class="alarm-info">
      ⏰ 측정 권장 시간: <b>09:00 / 11:30 / 16:30 / 22:00</b>
    </div>
    
    <form id="bpForm">
      <label>수축기 (높은 혈압)</label>
      <input type="number" id="sys" placeholder="예: 120" required>
      
      <label>이완기 (낮은 혈압)</label>
      <input type="number" id="dia" placeholder="예: 80" required>
      
      <label>메모 (선택사항)</label>
      <input type="text" id="memo" placeholder="예: 식전, 약 복용, 두통 등">
      
      <button type="submit" class="submit-btn">기록하기</button>
    </form>
  </div>

  <div class="card">
    <h3>📊 혈압 변화 그래프</h3>
    <canvas id="bpChart"></canvas>
  </div>

  <div class="card">
    <div class="header-group">
      <h3>📝 최근 기록</h3>
      <button type="button" class="excel-btn" onclick="exportToXlsx()">📊 XLSX 다운로드</button>
    </div>
    <ul id="recordList"></ul>
  </div>

</body>
</html>
