<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>혈압 수첩</title>
  <link rel="manifest" href="data:application/manifest+json;utf8,{%22name%22:%22혈압수첩%22,%22short_name%22:%22혈압수첩%22,%22start_url%22:%22/%22,%22display%22:%22standalone%22,%22background_color%22:%22#ffffff%22,%22theme_color%22:%22#2563eb%22}">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background: #f3f4f6; margin: 0; padding: 16px; color: #1f2937; }
    .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 16px; }
    h1 { font-size: 20px; margin-top: 0; color: #2563eb; text-align: center; }
    h3 { font-size: 17px; margin-bottom: 12px; }
    label { font-size: 14px; color: #4b5563; font-weight: 600; display: block; margin-top: 10px; }
    input { width: 100%; padding: 12px; margin-top: 4px; border: 1px solid #d1d5db; border-radius: 8px; font-size: 16px; }
    button.submit-btn { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; margin-top: 16px; cursor: pointer; }
    .alarm-info { background: #eff6ff; padding: 12px; border-radius: 8px; font-size: 13px; color: #1e40af; margin-bottom: 16px; text-align: center; }
    ul { list-style: none; padding: 0; margin: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid #f3f4f6; }
    
    /* 최근 기록 글씨 크기 */
    .bp-val { font-size: 20px; font-weight: 800; color: #111827; }
    .unit { font-size: 14px; font-weight: normal; color: #6b7280; }
    .date { color: #4b5563; font-size: 14px; font-weight: 600; margin-top: 4px; }
    
    /* 삭제 버튼 */
    .del-btn { background: #fee2e2; color: #ef4444; border: none; padding: 5px 8px; border-radius: 6px; font-size: 11px; cursor: pointer; font-weight: bold; flex-shrink: 0; }
  </style>
</head>
<body>

  <div class="card">
    <h1>🩸 나의 혈압 수첩</h1>
    <div class="alarm-info">
      ⏰ 측정 권장 시간: <b>09:00 / 11:30 / 16:30 / 22:00</b>
    </div>
    
    <form id="bpForm">
      <label>수축기 (높은 혈압)</label>
      <input type="number" id="sys" placeholder="예: 120" required>
      
      <label>이완기 (낮은 혈압)</label>
      <input type="number" id="dia" placeholder="예: 80" required>
      
      <button type="submit" class="submit-btn">기록하기</button>
    </form>
  </div>

  <div class="card">
    <h3>📊 혈압 변화 그래프</h3>
    <canvas id="bpChart"></canvas>
  </div>

  <div class="card">
    <h3>📝 최근 기록</h3>
    <ul id="recordList"></ul>
  </div>

  <script>
    let records = JSON.parse(localStorage.getItem('bpRecords') || '[]');
    const ctx = document.getElementById('bpChart').getContext('2d');

    let chart = new Chart(ctx, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: '수축기', data: [], borderColor: '#ef4444', backgroundColor: '#ef4444', tension: 0.2 },
          { label: '이완기', data: [], borderColor: '#3b82f6', backgroundColor: '#3b82f6', tension: 0.2 }
        ]
      },
      options: { 
        responsive: true, 
        scales: { 
          x: {
            ticks: {
              font: { size: 10 },
              maxRotation: 45,
              minRotation: 0
            }
          },
          y: { min: 50, max: 180 } 
        } 
      }
    });

    function updateUI() {
      records.sort((a, b) => new Date(a.rawTime || 0) - new Date(b.rawTime || 0));
      const recentRecords = records.slice(-10);

      // 그래프 가로축 라벨에 날짜 + 시간 표시 (예: 10/24 09:00)
      chart.data.labels = recentRecords.map(r => r.displayTime || r.time);
      chart.data.datasets[0].data = recentRecords.map(r => r.sys);
      chart.data.datasets[1].data = recentRecords.map(r => r.dia);
      chart.update();

      const listEl = document.getElementById('recordList');
      listEl.innerHTML = records.slice().reverse().map((r, reversedIndex) => {
        const actualIndex = records.length - 1 - reversedIndex;
        return `
          <li>
            <div>
              <div class="bp-val">${r.sys} / ${r.dia} <span class="unit">mmHg</span></div>
              <div class="date">🕒 ${r.displayTime || r.time}</div>
            </div>
            <button class="del-btn" onclick="deleteRecord(${actualIndex})">삭제</button>
          </li>
        `;
      }).join('');
    }

    function deleteRecord(index) {
      if (confirm('이 기록을 삭제하시겠습니까?')) {
        records.splice(index, 1);
        localStorage.setItem('bpRecords', JSON.stringify(records));
        updateUI();
      }
    }

    document.getElementById('bpForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const sys = Number(document.getElementById('sys').value);
      const dia = Number(document.getElementById('dia').value);
      const now = new Date();
      
      const month = now.getMonth() + 1;
      const date = now.getDate();
      const hours = String(now.getHours()).padStart(2, '0');
      const minutes = String(now.getMinutes()).padStart(2, '0');
      
      const displayTime = `${month}/${date} ${hours}:${minutes}`;

      records.push({ sys, dia, time: displayTime, displayTime: displayTime, rawTime: now.toISOString() });
      localStorage.setItem('bpRecords', JSON.stringify(records));

      document.getElementById('sys').value = '';
      document.getElementById('dia').value = '';
      updateUI();
      alert('기록되었습니다!');
    });

    updateUI();
  </script>
</body>
</html>
